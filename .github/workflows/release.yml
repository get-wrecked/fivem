name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install zip
        run: sudo apt install zip

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push version bump change
        uses: EndBug/add-and-commit@a94899bca583c204427a224a7af87c02f9b325d5 # v9
        with:
          add: '["fxmanifest.lua"]'
          push: true
          default_author: github_actions
          message: 'chore: bump version to ${{ github.ref_name }}'

      - name: Install dependencies
        run: pnpm install

      - name: Run build script
        run: pnpm build

      - name: Bundle files
        run: |
          mkdir -p ./temp/medal/ui
          mkdir -p ./temp/medal/superSoaker
          cp ./{fxmanifest.lua,config.lua,README.md} ./temp/medal
          cp -r ./{clipping,gameVein,lib,services} ./temp/medal
          cp -r ./superSoaker/dist ./temp/medal/superSoaker/
          cp -r ./superSoaker/{README.md,client-main.lua,server-main.lua} ./temp/medal/superSoaker/
          cp -r ./ui/dist ./temp/medal/ui/
          cd ./temp && zip -r ../medal.zip ./medal

      - name: Create release
        uses: 'marvinpinto/action-automatic-releases@919008cf3f741b179569b7a6fb4d8860689ab7f0' # v1.2.1
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: medal.zip

      - name: Update tag
        uses: EndBug/latest-tag@8fcae8848c1e23fd8212258f69a9619bc62cad67 # v1
        with:
          ref: ${{ github.ref_name }}