name: Create Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Install zip
        run: sudo apt install zip

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 12.4.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Bump manifest version
        run: node .github/actions/bump-manifest-version.js
        env:
          TGT_RELEASE_VERSION: ${{ github.ref_name }}

      - name: Push version bump change
        uses: EndBug/add-and-commit@cc9c08ba6c8df3b93a8f2db63e89b98368ae2ae8 # v11
        with:
          add: '["fxmanifest.lua"]'
          push: true
          default_author: github_actions
          message: 'chore: bump version to ${{ github.ref_name }}'

      - name: Install dependencies
        run: pnpm install

      - name: Run build script
        run: pnpm build

      - name: Bundle files
        run: |
          mkdir -p ./temp/medal/ui
          mkdir -p ./temp/medal/superSoaker
          cp ./{fxmanifest.lua,config.lua,README.md} ./temp/medal
          cp -r ./{clipping,gameVein,lib,services} ./temp/medal
          cp -r ./superSoaker/dist ./temp/medal/superSoaker/
          cp -r ./superSoaker/{README.md,client-main.lua,server-main.lua} ./temp/medal/superSoaker/
          cp -r ./ui/dist ./temp/medal/ui/
          cd ./temp && zip -r ../medal.zip ./medal

      - name: Create release
        uses: 'marvinpinto/action-automatic-releases@v1.2.1'
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          files: medal.zip

      - name: Update tag
        uses: EndBug/latest-tag@v1
        with:
          ref: ${{ github.ref_name }}